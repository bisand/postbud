name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postbud
          POSTGRES_PASSWORD: postbud
          POSTGRES_DB: postbud
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postbud"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        env:
          DATABASE_URL: postgres://postbud:postbud@localhost:5432/postbud
        run: cargo test --workspace

      # The schema is the hardest thing here to change later. Proving it
      # applies to an empty database on every push is cheap.
      - name: migrations apply
        env:
          DATABASE_URL: postgres://postbud:postbud@localhost:5432/postbud
        run: cargo run -p postbud-cli -- migrate

  # ui/admin/dist is checked in and embedded into the binary; this job
  # proves it was built from the checked-in source. Without it, a source
  # edit without a rebuild ships an admin UI that silently lags its own
  # code.
  admin-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/admin/package-lock.json
      - name: build
        run: scripts/build-ui.sh
      - name: dist matches source
        run: git diff --exit-code ui/admin/dist
