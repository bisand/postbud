name: images

# Versioned images come from RELEASES, never from a bare tag. Pushing a tag
# used to be enough, which made it possible to deploy a version whose only
# description was its number -- and deploy/kustomization.yaml pins a release
# tag, so that number is what an operator reads six months later when
# something breaks. Requiring the release forces the notes to exist.
#
# main still builds, so a merge is testable as sha-<short> without inventing
# a version for it.
on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # contents: write so a release can bump the deployed tag itself --
      # see the last step.
      contents: write
      packages: write
    strategy:
      # One release, three images, one tag across all of them. The relay
      # images carry no build of ours -- they are `apk add` and a config
      # mount -- but they are versioned together so `newTag` in
      # deploy/kustomization.yaml stays the single line that says what is
      # running.
      matrix:
        include:
          - suffix: ""
            dockerfile: Dockerfile
          - suffix: "-postfix"
            dockerfile: docker/Dockerfile.postfix
          - suffix: "-opendkim"
            dockerfile: docker/Dockerfile.opendkim
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git describe` can name the version the
          # binary bakes in (shown in the admin UI).
          fetch-depth: 0

      - name: version
        run: echo "POSTBUD_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            # Belt and braces on the one tag a deploy actually pins. The
            # semver patterns above derive it from the git ref, which is
            # the tag on a release event too -- but if that ever stopped
            # matching, the image would build "successfully" without the
            # tag deploy/kustomization.yaml points at, and the failure
            # would show up as an ImagePullBackOff in the cluster.
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}

      # The relay is amd64. No arm64 build until something needs it --
      # every extra platform doubles the build for no one.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: |
            POSTBUD_VERSION=${{ env.POSTBUD_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The relay pod runs `postbud queue-report` beside Postfix, so with
      # one image name a postbud release changes the relay's pod template
      # and `strategy: Recreate` stops mail for a change that could not
      # affect it -- a dashboard fix restarting the MTA.
      #
      # This publishes the SAME digest under a second name so
      # deploy/kustomization.yaml can pin it apart. imagetools only
      # writes a manifest reference: no rebuild, no layers, no extra
      # storage. It is a second name for one image, not a second image.
      - name: alias the queue-report image
        if: matrix.suffix == ''
        run: |
          set -eu
          printf '%s\n' '${{ steps.meta.outputs.tags }}' | while read -r tag; do
              [ -n "$tag" ] || continue
              alias=$(printf '%s' "$tag" | sed 's|/postbud:|/postbud-queue-report:|')
              [ "$alias" != "$tag" ] || continue
              echo "aliasing $tag -> $alias"
              docker buildx imagetools create -t "$alias" "$tag"
          done

      # A release IS the deploy. Editing deploy/kustomization.yaml by
      # hand afterwards was the step that got forgotten, and forgetting
      # it means the cluster silently stays on the previous version while
      # the release notes say otherwise.
      #
      # ONLY the `postbud` entry. The relay images are rebuilt by every
      # release but are byte-identical unless their Dockerfile or base
      # changed, and bumping their tag would roll Postfix -- with
      # `strategy: Recreate`, stopping mail -- for an image that did not
      # change. Those move deliberately, in the commit that changes them.
      - name: point the deployment at this release
        if: github.event_name == 'release' && matrix.suffix == ''
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          git fetch origin main
          git checkout main
          python3 - "$TAG" <<'PY'
          import re, sys
          tag = sys.argv[1]
          p = "deploy/kustomization.yaml"
          s = open(p).read()
          new, n = re.subn(
              r"(- name: postbud\n    newName: ghcr\.io/[^\n]+\n    newTag: )\S+",
              lambda m: m.group(1) + tag,
              s,
              count=1,
          )
          assert n == 1, "did not find the postbud image entry to bump"
          open(p, "w").write(new)
          PY
          if git diff --quiet deploy/kustomization.yaml; then
              echo "already at $TAG"
              exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/kustomization.yaml
          # [skip ci] so the push does not trigger another image build:
          # nothing here changes an image.
          git commit -m "Deploy $TAG [skip ci]"
          git push origin main
