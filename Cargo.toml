[workspace]
resolver = "2"
members = [
    "crates/postbud-core",
    "crates/postbud-db",
    "crates/postbud-relay",
    "crates/postbud-api",
    "crates/postbud-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/bisand/postbud"

# postbud runs next to the services it serves, on the same small budget.
# Same reasoning as regnmed's release profile: thin LTO keeps most of the
# size win for markedly less build time, and `strip` is deliberately left
# out so a panic in production still names functions in the backtrace.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
postbud-api = { path = "crates/postbud-api" }
postbud-core = { path = "crates/postbud-core" }
postbud-db = { path = "crates/postbud-db" }
postbud-relay = { path = "crates/postbud-relay" }

anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
hex = "0.4"
# Embeds the compiled admin UI (ui/admin/dist, checked in) into the
# binary, so cargo never needs node — regnmed's portal discipline.
include_dir = "0.7"
# SMTP client only. postbud never resolves MX, never talks to the public
# internet: it hands finished messages to Postfix, which owns delivery.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "tokio1",
    "tokio1-rustls-tls",
    "ring",
    "webpki-roots",
] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# A panic in one request becomes a 500, never a dead process.
tower-http = { version = "0.7", default-features = false, features = [
    "catch-panic",
] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
