[workspace]
resolver = "2"
members = [
    "crates/postbud-core",
    "crates/postbud-db",
    "crates/postbud-relay",
    "crates/postbud-api",
    "crates/postbud-cli",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/bisand/postbud"

# postbud is built to fit a small VM. Thin LTO keeps most of the size win
# for markedly less build time, and `strip` is deliberately left out so a
# panic in production still names functions in the backtrace.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
postbud-api = { path = "crates/postbud-api" }
postbud-core = { path = "crates/postbud-core" }
postbud-db = { path = "crates/postbud-db" }
postbud-relay = { path = "crates/postbud-relay" }

anyhow = "1"
# The DMARC report mailbox. async-imap leaves the transport to the caller,
# so the TLS stream is built here from rustls and webpki-roots -- the same
# choice reqwest and lettre already make, and the reason the scratch image
# needs no CA bundle. ring rather than aws-lc-rs: it is already in the tree
# and needs no C toolchain in the alpine builder.
async-imap = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
] }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
# DMARC aggregate reports: XML, usually inside a gzip or zip attachment.
# Unwrapping and parsing are byte transforms rather than I/O, so they sit
# in postbud-core beside the DSN parser and stay testable without a
# mailbox. zip's default features drag in bzip2/zstd/AES for formats no
# reporter uses; deflate is the whole of what DMARC needs.
flate2 = "1"
quick-xml = { version = "0.41", features = ["serialize"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
# DNS lookups for domain verification (worker-side only).
hickory-resolver = { version = "0.24", default-features = false, features = [
    "tokio-runtime",
    "system-config",
] }
# Embeds the compiled admin UI (ui/admin/dist, checked in) into the
# binary, so cargo never needs node.
include_dir = "0.7"
# OIDC id_token validation for the admin surface (RS256 against the
# issuer's JWKS).
jsonwebtoken = "9"
# Talks to the OIDC issuer only: discovery, JWKS, and the proxied code
# exchange. webpki-roots so the scratch image needs no CA bundle.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "json",
] }
# SMTP client only. postbud never resolves MX, never talks to the public
# internet: it hands finished messages to Postfix, which owns delivery.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "tokio1",
    "tokio1-rustls-tls",
    "ring",
    "webpki-roots",
    # Connections are reused across messages. Measured without it: 200
    # messages opened 200 connections. That costs almost no TIME on a
    # loopback relay, which is why it is easy to miss — what it costs is
    # 200 smtpd processes on a one-core relay, and a burst that walks into
    # Postfix's per-client connection limits for no reason.
    "pool",
] }
# Pulls the report attachment out of the message that carried it. Reports
# arrive as gzip, zip or bare XML, and the part's declared content type is
# not reliable -- postbud_core::dmarc sniffs the bytes instead.
mail-parser = "0.11"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    # jsonb, for the per-mechanism DMARC auth results that nothing
    # aggregates and columns would only scatter.
    "json",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# A panic in one request becomes a 500, never a dead process.
tower-http = { version = "0.7", default-features = false, features = [
    "catch-panic",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
# Pinned to the copy reqwest and lettre already pull, so the binary
# carries one root store rather than two.
webpki-roots = "0.26"
