apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: postbud

resources:
  - namespace.yaml
  - postgres.yaml
  - postbud.yaml
  - relay.yaml

# The image tag lives here and nowhere else: bumping this line is the
# deploy, reverting it is the rollback.
#
# The `postbud` tag is set by the release workflow, not by hand -- doing
# it manually was the step that got forgotten, and forgetting it leaves
# the cluster on the previous version while the release notes claim
# otherwise. The relay tags below are NOT touched automatically; see the
# note about them further down.
#
# Always a release tag, never `latest`. With `latest` the tag never
# changes, so Flux sees no diff and never redeploys -- the cluster
# silently sticks on whatever it first pulled.
#
# Everything in the relay pod is pinned SEPARATELY from postbud, and
# deliberately so.
#
# `strategy: Recreate` means rolling the relay is a gap with no relay at
# all. Tying it to postbud's tag would stop mail for changes that cannot
# affect mail -- a dashboard fix restarting the MTA.
#
# That includes postbud-queue-report, which is the postbud image under a
# second name. Pinning only postfix and opendkim did NOT work: the
# reporter runs the postbud binary, so `name: postbud` matched inside
# the relay pod and rolled it anyway.
#
# Bump these three when the relay changes. Leaving them behind is not
# drift; it is the point.
images:
  - name: postbud
    newName: ghcr.io/bisand/postbud
    newTag: v0.13.0
  - name: postbud-queue-report
    newName: ghcr.io/bisand/postbud-queue-report
    newTag: v0.11.2
  - name: postbud-postfix
    newName: ghcr.io/bisand/postbud-postfix
    newTag: v0.11.0
  - name: postbud-opendkim
    newName: ghcr.io/bisand/postbud-opendkim
    newTag: v0.11.0
