apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: postbud

resources:
  - namespace.yaml
  - postgres.yaml
  - postbud.yaml
  - relay.yaml

# The image tag lives here and nowhere else: bumping this line is the
# deploy, reverting it is the rollback.
#
# Always a release tag, never `latest`. With `latest` the tag never
# changes, so Flux sees no diff and never redeploys -- the cluster
# silently sticks on whatever it first pulled.
#
# The relay is pinned SEPARATELY from postbud, and deliberately so.
#
# Every release rebuilds all three images, but the relay ones are `apk
# add` over Alpine and change only when their Dockerfile or base does.
# Tying them to postbud's tag would mean a dashboard fix restarts the
# MTA -- and `strategy: Recreate` makes that a gap with no relay at all,
# so a change that cannot affect mail would stop it anyway.
#
# Bump the relay tag when the relay images change. Leaving it behind is
# not drift; it is the point.
images:
  - name: postbud
    newName: ghcr.io/bisand/postbud
    newTag: v0.11.1
  - name: postbud-postfix
    newName: ghcr.io/bisand/postbud-postfix
    newTag: v0.11.0
  - name: postbud-opendkim
    newName: ghcr.io/bisand/postbud-opendkim
    newTag: v0.11.0
