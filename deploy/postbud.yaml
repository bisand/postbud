# postbud: the API and the delivery worker.
#
# Two Deployments, not one with two containers. They fail independently:
# the API must keep accepting mail while the relay is unreachable, and the
# worker must be restartable without dropping requests.
apiVersion: v1
kind: Service
metadata:
  name: postbud-api
  namespace: postbud
spec:
  type: NodePort
  selector:
    app: postbud-api
  ports:
    - port: 8080
      targetPort: 8080
      # Fixed so the host's bounce pipe has a stable address to POST to.
      # Reachable only from loopback and the tailnet -- the host firewall
      # drops it from anywhere else.
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postbud-api
  namespace: postbud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postbud-api
  template:
    metadata:
      labels:
        app: postbud-api
    spec:
      initContainers:
        # Idempotent, and running it on every rollout means a deploy can
        # never reach a pod whose schema is older than its code.
        - name: migrate
          image: postbud
          args: ["migrate"]
          envFrom:
            - secretRef:
                name: postbud-secrets
      containers:
        - name: api
          image: postbud
          args: ["serve"]
          env:
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
          envFrom:
            - secretRef:
                name: postbud-secrets
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 24Mi
              cpu: 20m
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postbud-worker
  namespace: postbud
spec:
  # Safe at any number: claiming is `for update skip locked`, so replicas
  # take disjoint batches without coordinating. Two, not more, and for
  # AVAILABILITY rather than throughput -- a restart or a rolling update
  # no longer stops delivery dead. Throughput comes from WORKER_CONCURRENCY
  # below, which costs no extra pod; on a one-core box more replicas would
  # buy nothing, and the ceiling above both is the single relay anyway.
  #
  # Every replica must land on the node running Postfix, since RELAY_HOST
  # is that node's cni0 bridge. True by construction here (single-node
  # k3s); a second node would need a nodeSelector before scaling.
  replicas: 2
  selector:
    matchLabels:
      app: postbud-worker
  template:
    metadata:
      labels:
        app: postbud-worker
    spec:
      containers:
        - name: worker
          image: postbud
          args: ["worker"]
          env:
            # The Postfix relay runs on the host. 10.42.0.1 is the cni0
            # bridge -- the host as a pod sees it. Traffic never leaves
            # the box, which is why TLS is off on this hop; the DKIM
            # signature is applied on the far side by OpenDKIM.
            - name: RELAY_HOST
              value: "10.42.0.1"
            - name: RELAY_PORT
              value: "25"
            - name: RELAY_TLS
              value: "none"
            - name: WORKER_BATCH
              value: "20"
            # Deliveries in flight at once, per pod. The batch used to be
            # relayed strictly one message at a time, so batching bought
            # nothing. 2 pods x 8 = 16 concurrent SMTP connections, well
            # under Postfix's default 50-per-client limit.
            - name: WORKER_CONCURRENCY
              value: "8"
            # Must clear WORKER_CONCURRENCY + 1: the extra one is held for
            # the whole process lifetime by the queue-notification
            # listener. Under it, deliveries would queue at the last step,
            # writing down what already happened.
            #
            # 12 and not more because the ceilings have to add up against
            # postgres.yaml's max_connections=50: 2 workers x 12, plus the
            # API's 8, plus the purge job's 8, plus the 3 Postgres reserves
            # for superusers, is 43. Raising this means raising that.
            - name: DATABASE_MAX_CONNECTIONS
              value: "12"
            # Now only the safety net. A newly accepted message arrives via
            # a NOTIFY inside the accepting transaction; this interval is
            # what catches retries, whose due time nothing can announce in
            # advance.
            - name: WORKER_IDLE_MS
              value: "2000"
          envFrom:
            - secretRef:
                name: postbud-secrets
          resources:
            requests:
              memory: 24Mi
              cpu: 20m
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postbud-purge
  namespace: postbud
spec:
  # Message bodies are personal data; the delivery record is not. This
  # blanks bodies whose delivery is long finished.
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: purge
              image: postbud
              args: ["purge"]
              envFrom:
                - secretRef:
                    name: postbud-secrets
              resources:
                requests:
                  memory: 16Mi
                limits:
                  memory: 64Mi
