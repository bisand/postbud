# The relay, in the cluster.
#
# hostNetwork, because inbound port 25 must see the real client address:
# a Service would SNAT it and break inbound SPF, logging and the reject
# rules. It also keeps outbound leaving as the node's address, so PTR and
# HELO stay valid, and it means the worker's RELAY_HOST=10.42.0.1 reaches
# this pod unchanged.
#
# dnsPolicy Default, NOT ClusterFirstWithHostNet: Postfix resolves MX for
# every delivery, and pointing that at CoreDNS would put a cluster pod in
# the path of all outgoing mail. The host resolver is what the relay used
# before and has no such dependency. The consequence is that cluster DNS
# names do not resolve here, which is why postbud is reached on the
# node's loopback below rather than by service name.
#
# Config and keys are NOT in this repo: they name hosts, domains and
# addresses, and this repo stays generic. They are created out of band --
# see scripts/secrets-sync.sh for keeping a copy of the secrets.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postbud-relay-spool
  namespace: postbud
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # The live spool is under a megabyte; this is room for a receiver
      # being unreachable for the full four-day queue lifetime.
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postbud-relay
  namespace: postbud
spec:
  replicas: 1
  # RECREATE, never RollingUpdate. Two Postfix masters sharing one spool
  # is queue corruption, and a rolling update would briefly do exactly
  # that. A few seconds without a relay is the cheaper failure: postbud
  # keeps accepting and queueing while it is gone.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postbud-relay
  template:
    metadata:
      labels:
        app: postbud-relay
    spec:
      hostNetwork: true
      dnsPolicy: Default
      # No fsGroup: it makes every mounted volume group writable, which
      # Postfix rejects as an unsafe queue directory. The DKIM keys are
      # made readable by copying them instead -- see the opendkim
      # container's command.
      initContainers:
        # A self-signed cert for inbound STARTTLS, generated per pod.
        # The host used Debian's snakeoil cert, which is also self-signed
        # -- no verifier anywhere checks it. Generated at runtime rather
        # than baked into the image, because a private key in a published
        # image layer is a published private key.
        - name: prepare
          image: postbud-postfix
          command:
            - sh
            - -c
            - |
              set -eu
              # The queue directory must not be world writable. local-path
              # provisions volumes 0777, and Postfix will not run `pickup`
              # on a spool it considers unsafe -- SILENTLY: mail stops in
              # maildrop, never reaches cleanup, so the milter never sees
              # it and messages would go out UNSIGNED under
              # milter_default_action = accept. Everything reports healthy
              # while nothing is signed, which is why this is fixed here
              # rather than hoped for.
              chown root:root /var/spool/postfix
              chmod 0755 /var/spool/postfix

              # The spool OUTLIVES the image, and Alpine renumbers system
              # groups between releases -- postdrop moved from gid 101 to
              # 102 between 3.23 and 3.24. The queue directories keep the
              # old numeric group, so `maildrop`, which the setgid
              # postdrop binary must write into, silently belongs to the
              # wrong group after a base-image bump and local submission
              # stops working.
              #
              # `postfix set-permissions` repairs this, but also tries to
              # chown /etc/postfix and exits non-zero against a read-only
              # ConfigMap mount, so the repair is spelled out here.
              #
              # Absent on a fresh volume: Postfix creates them correctly
              # itself, and these are no-ops.
              for d in maildrop public; do
                  [ -d "/var/spool/postfix/$d" ] || continue
                  chown postfix:postdrop "/var/spool/postfix/$d"
              done
              [ -d /var/spool/postfix/maildrop ] && chmod 0730 /var/spool/postfix/maildrop
              [ -d /var/spool/postfix/public ] && chmod 0710 /var/spool/postfix/public
              [ -d /var/spool/postfix/pid ] && { chown root:root /var/spool/postfix/pid; chmod 0755 /var/spool/postfix/pid; }
              true
              chown postfix:root /var/lib/postfix
              chmod 0755 /var/lib/postfix
              chmod 0755 /tls

              test -s /tls/tls.key && exit 0
              openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
                -keyout /tls/tls.key -out /tls/tls.crt \
                -subj "/CN=$(cat /etc/mailname)"
              chmod 0400 /tls/tls.key
          volumeMounts:
            - { name: spool, mountPath: /var/spool/postfix }
            - { name: data, mountPath: /var/lib/postfix }
            - { name: tls, mountPath: /tls }
            - { name: postfix-config, mountPath: /etc/mailname, subPath: mailname }
      containers:
        - name: postfix
          image: postbud-postfix
          env:
            - name: POSTBUD_URL
              # The API's nodePort on the node's own loopback. With
              # dnsPolicy Default there is no cluster DNS here, and this
              # is the address the host's bounce script already used.
              value: http://127.0.0.1:30080
            - name: POSTBUD_BOUNCE_TOKEN_FILE
              value: /etc/postbud/bounce.token
          volumeMounts:
            - { name: spool, mountPath: /var/spool/postfix }
            # data_directory: TLS session caches. Losing these on restart
            # costs a handshake, so an emptyDir is the right lifetime.
            - { name: data, mountPath: /var/lib/postfix }
            - { name: tls, mountPath: /etc/postfix/tls, readOnly: true }
            - { name: bounce-token, mountPath: /etc/postbud, readOnly: true }
            # subPath per file: mounting the whole directory would hide
            # the rest of /etc/postfix that the package provides.
            - { name: postfix-config, mountPath: /etc/postfix/main.cf, subPath: main.cf }
            - { name: postfix-config, mountPath: /etc/postfix/master.cf, subPath: master.cf }
            - { name: postfix-config, mountPath: /etc/postfix/virtual, subPath: virtual }
            - { name: postfix-config, mountPath: /etc/postfix/virtual_recipients, subPath: virtual_recipients }
            - { name: postfix-config, mountPath: /etc/mailname, subPath: mailname }
          resources:
            requests: { memory: 64Mi, cpu: 10m }
            limits: { memory: 256Mi }
        - name: opendkim
          image: postbud-opendkim
          # busybox syslogd in front, writing to this container's stdout,
          # because opendkim can only log via syslog and a container has
          # no syslogd. Running without it saves a process and costs the
          # ability to diagnose anything: Postfix reports only that the
          # milter refused a message, never why.
          command:
            - sh
            - -c
            - |
              set -eu
              syslogd -O /dev/stdout -n &

              # opendkim refuses a key whose DIRECTORY is readable by
              # others, and Kubernetes mounts secret volumes world
              # readable whatever defaultMode says about the files. So
              # the keys are copied into a directory we own, and the
              # check stays on rather than being switched off.
              #
              # KeyTable already points at /etc/dkimkeys, so the copy
              # lands where the config expects and nothing else changes.
              mkdir -p /etc/dkimkeys
              cp /run/dkim-src/*.private /etc/dkimkeys/
              chown -R opendkim:opendkim /etc/dkimkeys
              chmod 0700 /etc/dkimkeys
              chmod 0400 /etc/dkimkeys/*.private

              exec opendkim -f -x /etc/opendkim/opendkim.conf
          volumeMounts:
            - { name: opendkim-config, mountPath: /etc/opendkim, readOnly: true }
            - { name: dkim-keys, mountPath: /run/dkim-src, readOnly: true }
          resources:
            requests: { memory: 32Mi, cpu: 5m }
            limits: { memory: 128Mi }
        # Moved in from its own DaemonSet at cutover: there is one queue
        # again, and it is this pod's. Sharing the spool volume means it
        # reads the same showq the Postfix beside it is serving.
        - name: queue-report
          image: postbud
          args: ["queue-report"]
          env:
            - name: POSTBUD_URL
              value: http://127.0.0.1:30080
            - name: QUEUE_REPORT_INTERVAL
              value: "5"
            - name: BOUNCE_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: postbud-secrets
                  key: BOUNCE_INGEST_TOKEN
          volumeMounts:
            - { name: spool, mountPath: /var/spool/postfix }
          resources:
            requests: { memory: 16Mi, cpu: 5m }
            limits: { memory: 64Mi }
          securityContext:
            # As the postfix uid, because /var/spool/postfix/public is
            # 0710 postfix:postdrop and `drop: ALL` removes
            # CAP_DAC_OVERRIDE -- so even root cannot traverse into it.
            # Running as the owner is the fix that does not loosen the
            # directory or hand back a capability.
            #
            # Numeric on purpose: this image has no passwd file, and the
            # only thing that matters is matching the uid the Postfix
            # container writes as.
            runAsUser: 100
            runAsGroup: 102
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: spool
          persistentVolumeClaim:
            claimName: postbud-relay-spool
        - { name: data, emptyDir: {} }
        - { name: tls, emptyDir: {} }
        - name: postfix-config
          configMap:
            name: postbud-postfix-config
        - name: opendkim-config
          configMap:
            name: postbud-opendkim-config
        - name: dkim-keys
          secret:
            secretName: postbud-dkim
            # Read by the container's root before it drops privileges,
            # then copied to a directory opendkim owns. The mode here is
            # about who can read the MOUNT; the copy is what satisfies
            # opendkim's own check on the directory.
            defaultMode: 0400
        - name: bounce-token
          secret:
            secretName: postbud-secrets
            items:
              - { key: BOUNCE_INGEST_TOKEN, path: bounce.token }
